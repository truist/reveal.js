<!doctype html>
<html lang="en">

	<head>

		<title>Thailand 2022</title>

		<meta name="author" content="Nathan Arthur">

		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

		<meta name="viewport" content="width=device-width, initial-scale=1.0">

		<link rel="stylesheet" href="dist/reset.css">
		<link rel="stylesheet" href="dist/reveal.css">

	<body>
		<div class="reveal">

			<!-- Any section element inside of this container is displayed as a slide -->
			<div class="slides">
				<section data-markdown="thailand.md"
						 data-separator="^\n\n"
						 data-separator-vertical="^\n---\n">
					<!-- slides loaded from external markdown -->
				</section>
			</div>
		</div>

		<script src="dist/reveal.js"></script>
		<script src="plugin/markdown/markdown.js"></script>
		<script>

			// https://revealjs.com/initialization/
			Reveal.initialize({
				controls: true,
				controlTutorial: true,
				progress: false,
				center: false,
				hash: true,

				transition: "slide",  // none, slide, fade, zoom
				backgroundTransition: "slide",  // none, slide, fade, zoom

				viewDistance: 2,
				mobileViewDistance: 2,
				autoPlayMedia: true,

				width: 1200,
				height: 700,
				//minScale: 0.6,
				maxScale: 1.0,
				//margin: 0,

				// Learn about plugins: https://revealjs.com/plugins/
				plugins: [ RevealMarkdown ]
			});

		</script>

	</body>

	<style>
		.reveal .backgrounds {
			background-image: radial-gradient(rgba(87, 40, 22, 0.7), black);
		}

		.reveal .slide-background-content {
			background-size: contain;
		}

		.reveal:not(.overview) .slides, .reveal .slides > section, .reveal .slides > section > section {
			min-height: 100%;
		}

		.reveal:not(.overview) .slides {
			/*
			height: 100% !important;
			inset: auto auto auto 50% !important;
			transform: translate(-50%, 0) scale(var(--slide-scale)) !important;
			*/
		}

		/*

			/*transform: translate(0, -50%);*/
			/*transform: translate(0, -50%) scale(var(--slide-scale));*/
			/*
		}

		.reveal section.top-text, .reveal section.bottom-text {
			height: 100%;
		}
		*/

		.reveal section > * {
			text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.5);
			width: 100%;
		}

		.reveal section.only-text {
			padding: 5% 0;
		}

		.reveal section.top-text > *, .reveal section.bottom-text > * {
			background-color: rgba(194, 83, 6, 0.7);
			color: rgba(239, 224, 182, 1);

			margin-top: 0;
			margin-bottom: 0;

			position: absolute;
			border-radius: 0.1em;
		}

		.reveal section.top-text > * {
			top: 20px;
		}

		.reveal section.bottom-text > * {
